# Test the converter and viewer, rebuild the spm model from the committed GDS,
# and publish the viewer to GitHub Pages. Pull requests only run the tests.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: converter/requirements.txt

      - name: Install converter
        run: |
          python -m venv .venv
          .venv/bin/pip install -r converter/requirements.txt

      - name: Converter tests
        working-directory: converter
        run: ../.venv/bin/pytest

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install viewer
        working-directory: viewer
        run: npm ci

      - name: Viewer tests
        working-directory: viewer
        run: npm test

      # The .glb is git-ignored; build it here from designs/spm/spm.gds.
      - name: Convert GDS to glTF
        working-directory: viewer
        run: npm run model

      # A project site lives at https://<user>.github.io/<repo>/.
      - name: Build viewer
        working-directory: viewer
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: viewer/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
