<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chip Viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage" aria-label="3D view of the spm chip layout"></canvas>

    <aside id="panel">
      <header>
        <h1>spm <span>sky130A</span></h1>
        <button id="theme" class="icon" type="button" aria-label="Switch light or dark theme" title="Light / dark">◐</button>
        <button id="collapse" class="icon" type="button" aria-expanded="true" aria-controls="panel-body" title="Collapse panel">▾</button>
      </header>
      <p id="status">Loading model…</p>

      <div id="panel-body">
        <label class="slider">
          <span>Z exaggeration <output id="zout">1×</output></span>
          <input id="zscale" type="range" min="1" max="20" step="0.5" value="1" />
        </label>

        <label class="slider">
          <span>Explode <output id="xout">0%</output></span>
          <input id="explode" type="range" min="0" max="1" step="0.01" value="0" />
        </label>

        <button id="toggle" class="wide" type="button" aria-pressed="false">Take apart <kbd>Space</kbd></button>
        <p id="readout" aria-live="polite"></p>

        <h2>View</h2>
        <div class="segmented" role="group" aria-label="Camera">
          <button id="persp" type="button" aria-pressed="true">Perspective</button>
          <button id="iso" type="button" aria-pressed="false">Isometric <kbd>I</kbd></button>
        </div>
        <button id="fit" class="wide" type="button">Fit view <kbd>F</kbd></button>
        <div class="checks">
          <label><input id="edges" type="checkbox" /> Edges</label>
          <label><input id="ruler" type="checkbox" checked /> µm ruler</label>
        </div>

        <h2>Layers</h2>
        <ul id="layers"></ul>
        <p class="hint">Click a layer or the chip to identify it</p>
      </div>
    </aside>

    <section id="card" hidden aria-live="polite">
      <h3><span class="swatch"></span><span class="title"></span></h3>
      <dl></dl>
      <p class="hint"><kbd>↑</kbd><kbd>↓</kbd> step through layers · <kbd>Esc</kbd> clear</p>
    </section>

    <div id="scalebar" hidden aria-hidden="true"><span class="bar"></span><span class="text"></span></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
