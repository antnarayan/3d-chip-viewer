<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chip Viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage" aria-label="3D view of the spm chip layout"></canvas>

    <aside id="panel">
      <h1>spm <span>sky130A</span></h1>
      <p id="status">Loading model…</p>

      <label class="slider">
        <span>Z exaggeration <output id="zout">1×</output></span>
        <input id="zscale" type="range" min="1" max="20" step="0.5" value="1" />
      </label>

      <h2>Layers</h2>
      <ul id="layers"></ul>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
